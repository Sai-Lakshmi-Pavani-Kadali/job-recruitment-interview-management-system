{% extends "base.html" %}
{% block title %}Company profile{% endblock %}
{% block content %}
<h1 class="h3 mb-3">{{ 'Company profile' if comp else 'Create your company profile' }}</h1>
<form method="post" class="card"><div class="card-body p-4">
  {{ csrf_input() }}
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="name">Company name</label>
      <input class="form-control" id="name" name="name" value="{{ comp.name if comp else '' }}" required></div>
    <div class="col-md-6"><label class="form-label" for="industry">Industry</label>
      <input class="form-control" id="industry" name="industry" value="{{ comp.industry or '' if comp else '' }}"></div>
    <div class="col-md-6"><label class="form-label" for="website">Website</label>
      <input class="form-control" type="url" id="website" name="website" value="{{ comp.website or '' if comp else '' }}" placeholder="https://"></div>
    <div class="col-md-6"><label class="form-label" for="location">Headquarters</label>
      <input class="form-control" id="location" name="location" value="{{ comp.location or '' if comp else '' }}"></div>
    <div class="col-12"><label class="form-label" for="description">About the company</label>
      <textarea class="form-control" id="description" name="description" rows="5">{{ comp.description or '' if comp else '' }}</textarea></div>
  </div>
  <button class="btn btn-primary mt-4">Save company profile</button>
</div></form>
{% endblock %}
